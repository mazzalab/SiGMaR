name: mutational_pipeline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.11
  - pip
  - pip:
      - dash
      - dash-bootstrap-components
      - dash-uploader
      - pandas
      - plotly
      - requests
      - configparser

  # R
  - r-base=4.3
  - r-essentials
  - bioconductor-deseq2
  - r-optparse  # optional, for argument parsing in R scripts
  - r-tidyverse
  - r-data.table
  - r-devtools